<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen flex justify-center items-center p-5">

<div class="w-full max-w-md">

    <h1 class="text-4xl font-bold text-center text-white mb-6">
        GitHub Profile Finder
    </h1>

    <div class="flex gap-2">

        <input
            id="searchInput"
            type="text"
            placeholder="Enter GitHub Username..."
            class="flex-1 rounded-lg p-3 outline-none text-white bg-gray-700 border border-gray-600 focus:border-blue-400">

        <button
            id="searchBtn"
            class="bg-blue-600 px-5 rounded-lg text-white hover:bg-blue-700 transition">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

    </div>

    <div
        id="loading"
        class="hidden text-center mt-8 text-blue-300">

        <i class="fa-solid fa-spinner fa-spin text-4xl"></i>

        <p class="mt-3">Loading Profile...</p>

    </div>

    <div id="profileContainer" class="mt-6"></div>

</div>

<script src="script.js"></script>

</body>
</html>
